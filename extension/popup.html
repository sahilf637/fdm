<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 240px; padding: 12px; margin: 0; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
      label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
      .status { color: #666; font-size: 12px; }
      button { padding: 6px 10px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>FDM Integration</h1>
    <div class="row">
      <label><input type="checkbox" id="enabled" /> Auto-capture downloads</label>
    </div>
    <div class="row">
      <button id="test">Test connection</button>
      <span id="status" class="status"></span>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
